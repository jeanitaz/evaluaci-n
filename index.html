<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.0/dist/darkly/bootstrap.min.css">
    <title>Document</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
        }

        .navbar-brand {
            font-size: 2rem; /* Tamaño de la fuente del logotipo */
        }

        .nav-link {
            font-size: 1.5rem; /* Tamaño de la fuente de los enlaces del menú */
        }

        .form-control, .btn {
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.1rem; /* Tamaño de la fuente para otros elementos */
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand fs-5 text-wrap" href="#">Botscrew</a> <!-- Texto adaptativo -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor02" aria-controls="navbarColor02" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor02">
                <ul class="navbar-nav mx-auto"> <!-- Cambiado: Centramos el menú -->
                    <li class="nav-item">
                        <a class="nav-link active fs-6 text-wrap" href="#">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 text-wrap" href="#">Principal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fs-6 text-wrap" href="#">Contacto</a>
                    </li>
                </ul>
                <form class="d-flex">
                    <input class="form-control me-sm-2" type="search" placeholder="Search">
                    <button class="btn btn-secondary my-2 my-sm-0" type="submit">Search</button>
                </form>
            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
